name: Desktop installer

# Builds the Windows (NSIS) installer for the Electron shell and uploads it as a build artifact.
# Separate from ci.yml (fast feedback) and build-apk.yml (Android); it only runs when something that
# ends up in the desktop app can have changed.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/desktop-installer.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-installer.yml'
  workflow_dispatch:

permissions:
  contents: write # needed only to attach the installer to a draft release on version tags

concurrency:
  group: desktop-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install web app dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      # build also typechecks the web app; the shell is typechecked next
      - name: Typecheck desktop shell
        run: npm run typecheck:desktop

      - name: Unit tests
        run: npm test

      # `dist` compiles the shell, runs electron-builder, then verifies the installer and the asar contents
      - name: Build installer
        run: npm run desktop:dist

      - name: Smoke test the packaged app
        run: npx playwright test -c desktop packaged
        env:
          CI: 'true'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: wavelocal-windows-installer
          path: |
            desktop/release/Wavelocal-Setup-*.exe
            desktop/release/Wavelocal-Setup-*.exe.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to draft release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: desktop/release/Wavelocal-Setup-*.exe
