name: CI

# Fast feedback on every push and pull request. The Android APK has its own workflow (build-apk.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app and e2e)
        run: npm run typecheck

      - name: Typecheck (desktop shell)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm --prefix desktop ci && npm run typecheck:desktop

      # One run does both: the unit tests, and the coverage thresholds in vite.config.js (a drop below them fails the build).
      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e "
          const total = require('./coverage/coverage-summary.json').total;
          const row = (k) => '| ' + k + ' | ' + total[k].pct + '% | ' + total[k].covered + ' of ' + total[k].total + ' |';
          console.log(['### Unit test coverage', '', '| | | |', '|---|---|---|', ...['statements', 'branches', 'functions', 'lines'].map(row), '', 'Components, hooks and the audio engine are covered by the Playwright suite, which is not counted here.'].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: End-to-end (Chromium, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browsers are large; key the cache on the exact Playwright version so an upgrade refreshes it.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cache hit restores the browser binaries but not the apt packages they need.
      - name: Install system libraries only
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build web app
        run: npm run build

      - name: Check bundle size budget
        run: npm run size

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: 'true'

      # Traces, screenshots and the HTML report make a red run debuggable without re-running it locally.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
