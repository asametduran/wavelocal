name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed only to create a draft release on version tags

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Capacitor 8 compiles the Android project for Java 21.
      - name: Set up Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # What the unit tests cannot read: the permissions of the finished app, after every library's manifest has been merged into ours.
      # INTERNET is the only one the app asks for (AndroidX adds a signature-level permission of its own to apps that use its receivers).
      # Anything else came with a plugin or an upgrade of one, and that has to be a decision and not a surprise.
      - name: Check the permissions of the APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TOOL="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$TOOL" || { echo "::error::apkanalyzer not found at $TOOL"; exit 1; }
          PERMISSIONS=$("$TOOL" manifest permissions "$APK")
          echo "Permissions in the APK:"
          echo "$PERMISSIONS"
          UNEXPECTED=$(echo "$PERMISSIONS" | grep -v -x -e 'android.permission.INTERNET' -e '.*\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' | grep . || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::The APK asks for permissions the app does not: $UNEXPECTED"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavelocal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create draft release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
